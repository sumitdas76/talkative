    blobs.forEach((b) => {
      const el = document.getElementById(b.id);
      const phase = { p: b.phase0 };
      const cycles = TOTAL / b.period;
      tl.to(
        phase,
        {
          p: b.phase0 + Math.PI * 2 * cycles,
          duration: TOTAL,
          ease: "none",
          onUpdate: () => {
            const s = Math.sin(phase.p);
            const c = Math.cos(phase.p * 0.7);
            el.style.transform = `translate(${s * b.ax}px, ${c * b.ay}px) scale(${1 + s * b.as})`;

    // ── Scene 1 (0.0-1.557s): glowing shield badge pops in dead-center-top

        { opacity: 0, scale: 0.75 },

        glow,

      if (!isFinal) {
