  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ── Scene 1 (0.0-1.3s): swirl field ALREADY drifting from t=0 (never a
    // cold static open) -- continuous, non-repeating waypoint drift on each
    // blob's own x/y translate only (scale/opacity are reserved for the
    // discrete glow-bloom pulses below, so the two never fight the same
    // property). A blue->violet gradient accent-line draws in dead-center,
    // ~38% down, and blooms a brief glow-flash on arrival.

    // Blob A: sweeps down-right, then eases back up-left, then a last drift.
    tl.fromTo("#clh-blob-a", { xPercent: -7, yPercent: -5 }, { xPercent: 4, yPercent: 4, duration: 1.55, ease: "sine.inOut" }, 0)
      .to("#clh-blob-a", { xPercent: -4, yPercent: 7, duration: 1.55, ease: "sine.inOut" }, 1.55)
      .to("#clh-blob-a", { xPercent: 5, yPercent: -3, duration: 0.889, ease: "sine.inOut" }, 3.10);

    // Blob B: opposite phase -- starts already sliding up-left.
    tl.fromTo("#clh-blob-b", { xPercent: 6, yPercent: 6 }, { xPercent: -5, yPercent: -4, duration: 1.75, ease: "sine.inOut" }, 0)
      .to("#clh-blob-b", { xPercent: 4, yPercent: 5, duration: 1.35, ease: "sine.inOut" }, 1.75)
      .to("#clh-blob-b", { xPercent: -3, yPercent: -3, duration: 0.899, ease: "sine.inOut" }, 3.10);

    // Blob C: slower, wider drift for depth-layered parallax against A/B.
    tl.fromTo("#clh-blob-c", { xPercent: -4, yPercent: 6 }, { xPercent: 6, yPercent: -5, duration: 2.0, ease: "sine.inOut" }, 0)
      .to("#clh-blob-c", { xPercent: -6, yPercent: 4, duration: 1.999, ease: "sine.inOut" }, 2.0);

    // Accent line draws in (power3.out, no CSS transform on the element so
    // scaleX owns the whole transform -- avoids the gsap/css transform
    // conflict).
    tl.fromTo("#clh-accent-line", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 0.15);

    // Glow-flash blooms in behind the line, timed so bloom + line settle
    // resolve as one beat (~0.70-0.75s), then eases to a soft resting halo.
    tl.fromTo("#clh-accent-glow", { opacity: 0, scale: 0.82 }, { opacity: 0.55, scale: 1.12, duration: 0.24, ease: "power2.out" }, 0.50)
      .to("#clh-accent-glow", { opacity: 0.16, scale: 1, duration: 0.55, ease: "power2.inOut" }, 0.74);

    // ── Shared per-word spring-pop: scale 0.4 -> 1 with back.out overshoot
    // (packet-specified, not a plain fade) + slight rise, settling clean.
    const wordSpring = (selector, start, dur) => {
      tl.fromTo(
        selector,
        { opacity: 0, scale: 0.4, y: 16 },
        { opacity: 1, scale: 1, y: 0, duration: dur, ease: "back.out(1.6)" },
        start
      );
    };

    // Swirl-field glow-bloom pulse fired exactly on a phrase's arrival --
    // all three blobs bump opacity + scale together, then settle back to
    // their resting base (opacity/scale are untouched by the drift tweens
    // above, so no property conflict).
    const BLOB_BASE = [
      { sel: "#clh-blob-a", opacity: 0.20 },
      { sel: "#clh-blob-b", opacity: 0.18 },
      { sel: "#clh-blob-c", opacity: 0.16 },
    ];
    const swirlPulse = (t) => {
      BLOB_BASE.forEach((b, i) => {
        const peak = Math.min(0.45, b.opacity + 0.20);
        const at = t + i * 0.025;
        tl.to(b.sel, { opacity: peak, scale: 1.08, duration: 0.22, ease: "power2.out" }, at)
          .to(b.sel, { opacity: b.opacity, scale: 1, duration: 0.55, ease: "power2.inOut" }, at + 0.22);
      });
    };

    // Scene 2 (1.3-2.3s): "Every other dictation app" -- per-word spring-pop
    // below the accent line, swirl pulses exactly on this arrival.
    swirlPulse(1.30);
    const line1 = document.querySelectorAll(".clh-line-1 .clh-word");
    [1.30, 1.47, 1.64, 1.81].forEach((t, i) => wordSpring(line1[i], t, 0.42));

    // Scene 3 (2.3-3.0s): "sends your voice" -- next line, same spring-in +
    // glow-pulse; blobs keep drifting further (already covered above).
    swirlPulse(2.30);
    const line2 = document.querySelectorAll(".clh-line-2 .clh-word");
    [2.30, 2.47, 2.64].forEach((t, i) => wordSpring(line2[i], t, 0.40));
