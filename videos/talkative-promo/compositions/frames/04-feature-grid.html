  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["04-feature-grid"] = tl;

    const TOTAL_DURATION = 5.163;

    // ── Swirl field: bounded drift + scale pulse, staggered periods so the
    // three blobs never breathe in lockstep. Always alive per frame.md. ──
    const blobs = [
      { el: document.getElementById("fg-blob-a"), cyclePeriod: 6.4, xAmp: 22, yAmp: 12, sAmp: 0.05 },
      { el: document.getElementById("fg-blob-b"), cyclePeriod: 7.6, xAmp: 18, yAmp: 16, sAmp: 0.045 },
      { el: document.getElementById("fg-blob-c"), cyclePeriod: 8.8, xAmp: 16, yAmp: 10, sAmp: 0.04 },
    ];
    blobs.forEach((b, i) => {
      const cycles = TOTAL_DURATION / b.cyclePeriod;
      const phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * cycles,
          duration: TOTAL_DURATION,
          ease: "none",
          onUpdate: () => {
            const s = Math.sin(phase.p);
            const c = Math.sin(phase.p * 1.3 + i);
            b.el.style.transform = `translate(${(s * b.xAmp).toFixed(2)}px, ${(c * b.yAmp).toFixed(2)}px) scale(${(1 + s * b.sAmp).toFixed(4)})`;
          },
        },
        0
      );
    });

    // ── Cards: each spring-pops into its slot on its own VO cue, with a
    // glow-flash landing as the SAME beat (ambient-glow-bloom, pulse-on-
    // arrival form). Card containers themselves are visible from t=0 as
    // the established empty-slot grid (hard cut from Frame 3); only the
    // badge + label + glow arrive per cue. ──
    const cards = [
      { n: 1, at: 0.04, peak: 0.34, overshoot: 0.42, ov: 1.7 },
      { n: 2, at: 1.147, peak: 0.34, overshoot: 0.42, ov: 1.7 },
      { n: 3, at: 2.583, peak: 0.34, overshoot: 0.42, ov: 1.7 },
      { n: 4, at: 4.018, peak: 0.44, overshoot: 0.45, ov: 2.1 }, // strongest glow-flash yet
    ];

    const BADGE_DUR = 0.44;
    const LABEL_OFFSET = 0.14;
    const LABEL_DUR = 0.34;
    const GLOW_BLOOM_DUR = 0.4;
    const GLOW_SETTLE_DUR = 0.32;
    const idlePeriods = [2.1, 2.4, 2.7]; // cards 1-3 only; card 4 lands too close to the cut

    cards.forEach((c) => {
      const badgeSel = `#fg-badge-${c.n}`;
      const labelSel = `#fg-label-${c.n}`;
      const glowSel = `#fg-glow-${c.n}`;
      const cardSel = `#fg-card-${c.n}`;

      // Spring-pop entrance — real overshoot, this project's dramatic register.
      tl.fromTo(
        badgeSel,
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: BADGE_DUR, ease: `back.out(${c.ov})` },
        c.at
      );
      tl.fromTo(
        labelSel,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: LABEL_DUR, ease: "power2.out" },
        c.at + LABEL_OFFSET
      );

      // Glow-flash: blooms PAST peak landing with the badge's settle, then
      // eases down to a steady low hold — one beat, "powering on".
      tl.fromTo(
        glowSel,
        { opacity: 0, scale: 0.82 },
        { opacity: c.overshoot, scale: 1.05, duration: GLOW_BLOOM_DUR, ease: "power2.out" },
        c.at
      );
      tl.to(
        glowSel,
        { opacity: c.peak, scale: 1, duration: GLOW_SETTLE_DUR, ease: "power1.inOut" },
        c.at + GLOW_BLOOM_DUR
      );

      const landedAt = c.at + LABEL_OFFSET + LABEL_DUR;
      const idleStart = landedAt + 0.1;
      const idleDur = TOTAL_DURATION - idleStart;

      if (c.n <= 3 && idleDur > 0.3) {
        // Gentle sine float on the settled card + a soft pulse on its glow edge.
        const period = idlePeriods[c.n - 1];
        const cycles = Math.max(1, idleDur / period);
        const cardEl = document.querySelector(cardSel);
        const glowEl = document.querySelector(glowSel);
        const phase = { p: 0 };
        const Y_AMP = 1.6;
        const SCALE_AMP = 0.007;
        const GLOW_AMP = 0.045;
        tl.to(
          phase,
          {
            p: Math.PI * 2 * cycles,
            duration: idleDur,
            ease: "none",
            onUpdate: () => {
              const s = Math.sin(phase.p);
              cardEl.style.transform = `translateY(${(s * Y_AMP).toFixed(3)}px) scale(${(1 + s * SCALE_AMP).toFixed(4)})`;
              glowEl.style.opacity = (c.peak + Math.sin(phase.p + Math.PI / 2) * GLOW_AMP).toFixed(3);
            },
          },
          idleStart
        );
      }
    });

    // ── Full blue → violet → pink gradient sweep, once, across the
    // completed tiles (ambient-glow-bloom, traveling sweep form). ──
    const SWEEP_START = 3.15;
    const SWEEP_DUR = 0.8;
    const SWEEP_PEAK = 0.55;
    // xPercent (relative to the sweep's own width) keeps the travel smooth
    // under frame-by-frame seek capture; `left` snaps to device pixels.
    tl.fromTo(
      "#fg-sweep",
      { xPercent: 0, opacity: 0 },
      { xPercent: 560, opacity: SWEEP_PEAK, duration: SWEEP_DUR, ease: "none" },
      SWEEP_START
    );
    tl.to("#fg-sweep", { opacity: 0, duration: 0.3, ease: "power1.in" }, SWEEP_START + SWEEP_DUR - 0.15);

    // ── Camera: neutral through the assemble, then a pronounced,
    // visible push-in once card 4 lands — holds to the cut into Frame 5.
    // Continuous organic micro-drift runs underneath the whole shot. ──
    const camera = document.getElementById("fg-camera");
    const cam = { scale: 1 };
    const PUSH_AT = 4.15;
    tl.to(cam, { scale: 1.1, duration: TOTAL_DURATION - PUSH_AT, ease: "power2.out" }, PUSH_AT);

    const drift = { p: 0 };
    tl.to(
      drift,
      {
        p: Math.PI * 2 * 1.3,
        duration: TOTAL_DURATION,
        ease: "none",
        onUpdate: () => {
          const dx = Math.sin(drift.p) * 5;
          const dy = Math.sin(drift.p * 1.3) * 2.5;
          camera.style.transform = `scale(${cam.scale.toFixed(4)}) translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px)`;
        },
      },
      0
    );
  </script>
