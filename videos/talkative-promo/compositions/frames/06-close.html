  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["06-close"] = tl;

    const root = document.querySelector('[data-composition-id="06-close"]');
    const icon = root.querySelector("#cx-icon");
    const flash = root.querySelector("#cx-flash");
    const wordmark = root.querySelector("#cx-wordmark");
    const tagline = root.querySelector("#cx-tagline");
    const wrapper = root.querySelector(".cx-lockup-wrapper");
    const ringsGroup = root.querySelector("#cx-rings");
    const blobs = root.querySelectorAll(".cx-blob");
    const ringSm = root.querySelector("#cx-ring-sm");
    const ringMd = root.querySelector("#cx-ring-md");
    const ringLg = root.querySelector("#cx-ring-lg");

    // Setup: measure each ring's real circumference (svg-path-draw) and start fully undrawn.
    [ringSm, ringMd, ringLg].forEach((c) => {
      const len = c.getTotalLength();
      c.style.strokeDasharray = String(len);
      c.style.strokeDashoffset = String(len);
    });

    const DURATION = 1.557;

    // ---- Swirl field: always-alive drift + gentle scale pulse, flaring brighter for the
    // climax over the first ~0.35s (ambient-glow-bloom register, driven by one shared phase). ----
    const BLOB_CFG = [
      { dx: 26, dy: -14, freq: 1.0, phase: 0.0, baseStart: 0.5, basePeak: 0.82, scaleAmp: 0.05 },
      { dx: -22, dy: 20, freq: 0.8, phase: 1.7, baseStart: 0.46, basePeak: 0.78, scaleAmp: 0.04 },
      { dx: 18, dy: 18, freq: 1.2, phase: 3.1, baseStart: 0.4, basePeak: 0.7, scaleAmp: 0.06 },
    ];
    const swirlDriver = { p: 0 };
    tl.to(
      swirlDriver,
      {
        p: 1,
        duration: DURATION,
        ease: "none",
        onUpdate: () => {
          const t = swirlDriver.p * DURATION;
          const flareEnv = Math.min(t / 0.35, 1); // 0->1 over the flare-in window, then holds bright
          blobs.forEach((el, i) => {
            const cfg = BLOB_CFG[i];
            const s = Math.sin(t * cfg.freq + cfg.phase);
            const base = cfg.baseStart + (cfg.basePeak - cfg.baseStart) * flareEnv;
            const opacity = Math.min(base + s * 0.08 * flareEnv, 0.95);
            const scale = 1 + s * cfg.scaleAmp;
            const x = s * cfg.dx;
            const y = Math.cos(t * cfg.freq * 0.7 + cfg.phase) * cfg.dy;
            el.style.opacity = String(opacity);
            el.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
          });
        },
      },
      0,
    );

    // ---- Scene 1 (0.0-0.374s): hard cut in, climax flare. The mark spring-BLOOMS from zero
    // dead center with real overshoot + slight rotation-in, landing with a bright glow-flash
    // behind it (whole-mark spring BLOOM: spring-pop-entrance, deliberate playful back.out). ----
    tl.fromTo(
      flash,
      { opacity: 0, scale: 0.5 },
      { opacity: 0.65, scale: 1.25, duration: 0.28, ease: "power2.out" },
      0.02,
    );
    tl.to(
      flash,
      { opacity: 0.22, scale: 1.05, duration: 0.35, ease: "power2.out" },
      0.3,
    );
    tl.fromTo(
      icon,
      { scale: 0, opacity: 0, rotation: -9 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.32, ease: "back.out(1.7)" },
      0.02,
    );

    // ---- Scene 2 (0.374-0.778s): icon slides up-and-left into its lockup slot while the
    // dual-glow "Talkative" wordmark wipes in beside it (no letter-stagger — window too tight);
    // gradient-stroked rings sweep in behind the pair as it centers. ----
    tl.to(
      icon,
      { x: -176, y: -12, duration: 0.34, ease: "power3.out" },
      0.374,
    );
    tl.fromTo(
      wordmark,
      { clipPath: "inset(0 100% 0 0)", opacity: 0 },
      { clipPath: "inset(0 0% 0 0)", opacity: 1, duration: 0.32, ease: "power2.out" },
      0.4,
    );

    tl.fromTo(
      ringsGroup,
      { opacity: 0, scale: 0.88 },
      { opacity: 1, scale: 1, duration: 0.2, ease: "power1.out" },
      0.374,
    );
    // Staggered per-ring draw (svg-path-draw): each starts at ~75% of the previous segment's
    // duration, before it finishes. The largest ring is deliberately left mid-draw past the
    // frame's own duration so it is still visibly sweeping on the very last held frame.
    tl.to(ringSm, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.42);
    tl.to(ringMd, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 0.795);
    tl.to(ringLg, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 1.15);
    // Gentle continuous sweep/rotation on the whole ring group, running to the very end.
    tl.to(
      ringsGroup,
      { rotation: 14, duration: DURATION - 0.374, ease: "none" },
      0.374,
    );

    // ---- Scene 3 (0.778-1.557s): as the VO lands "Just talk.", the glowing tagline wipes in
    // left->right beneath the lockup and settles. The completed lockup holds to the very last
    // frame, carried by an almost-imperceptible continuous scale-up — never freezing flat. ----
    tl.fromTo(
      tagline,
      { clipPath: "inset(0 100% 0 0)", opacity: 0 },
      { clipPath: "inset(0 0% 0 0)", opacity: 1, duration: 0.42, ease: "power2.out" },
      0.8,
    );
