    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ---- swirl field: continuous drift + gentle pulse, alive from t=0 ----

    const blobA = document.getElementById("tt-blob-a");
    const blobB = document.getElementById("tt-blob-b");
    const blobC = document.getElementById("tt-blob-c");
    const swirlPhase = { p: 0 };

      swirlPhase,
      {
        p: Math.PI * 2 * 0.8,
        duration: 1.28,
        ease: "none",
        onUpdate: () => {
          const p = swirlPhase.p;
          const sA = Math.sin(p);
          const sB = Math.sin(p + Math.PI / 2);
          const sC = Math.sin(p + Math.PI);
          blobA.style.transform = `translate(${sA * 14}px, ${sA * 10}px) scale(${1 + sA * 0.03})`;
          blobB.style.transform = `translate(${sB * -12}px, ${sB * 12}px) scale(${1 + sB * 0.035})`;
          blobC.style.transform = `translate(${sC * 10}px, ${sC * -10}px) scale(${1 + sC * 0.03})`;
        },
      },
      0,
    );

    // ---- Scene 1 (0.0-0.20s): hard cut in. Icon spring-pops with real
    // back.out overshoot inside its glow halo -- this frame's explicit
    // exception to the smooth-settle default (frame.md: "spring-pop
    // entrances with visible overshoot" is the video's first release of
    // energy after Frame 1's tension). Glow blooms PAST peak then eases
    // down -- the "brief bloom-flash on arrival" (ambient-glow-bloom,
    // pulse-on-arrival variant), landing on the icon's settle as one beat.

      "#tt-icon",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.24, ease: "back.out(1.6)" },
      0,
    );
    tl.fromTo(
      "#tt-icon-glow",
      { opacity: 0, scale: 0.8 },
      { opacity: 0.42, scale: 1.08, duration: 0.24, ease: "power2.out" },
      0,

    tl.to(

      { opacity: 0.22, scale: 1, duration: 0.18, ease: "power2.out" },
      0.24,
    );
