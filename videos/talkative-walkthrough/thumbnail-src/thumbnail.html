<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Talkative Thumbnail</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --accent: #4682b4; --accent-fg: #ffffff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050608; }

      .bg { position: absolute; inset: 0; background: #050608; }
      .vignette {
        position: absolute; inset: -10%;
        background: radial-gradient(650px 650px at 68% 42%, rgba(70,130,180,0.30) 0%, rgba(5,6,8,0) 62%);
      }
      .glow {
        position: absolute; left: 70%; top: 40%; width: 620px; height: 620px;
        transform: translate(-50%, -50%); border-radius: 50%;
        background: radial-gradient(circle, rgba(70,130,180,0.55) 0%, rgba(70,130,180,0) 68%);
      }
      .grain-edge {
        position: absolute; inset: 0;
        background: linear-gradient(115deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 42%);
      }

      .stage { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 0 0 78px; }

      .lockup { display: flex; align-items: center; gap: 22px; margin-bottom: 34px; }
      .logo {
        width: 108px; height: 108px; border-radius: 30px; background: var(--accent);
        display: flex; align-items: center; justify-content: center; font-size: 56px;
        box-shadow: 0 0 60px rgba(70,130,180,0.65);
      }
      .wordmark { color: #fff; font-size: 62px; font-weight: 800; letter-spacing: -0.02em; }

      .tagline { font-size: 92px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.04; color: #fff; max-width: 920px; }
      .tagline .accent { color: var(--accent); }

      .badge {
        position: absolute; right: 60px; top: 56px;
        font-size: 30px; font-weight: 800; color: #fff; letter-spacing: -0.01em;
        padding: 12px 26px; border: 3px solid var(--accent); border-radius: 10px;
        background: rgba(70,130,180,0.16);
      }

      .sub { margin-top: 30px; font-size: 32px; color: #a9bdd1; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="thumbnail" data-start="0" data-width="1280" data-height="720" data-duration="1">
      <section class="clip" data-start="0" data-duration="1">
        <div class="bg"></div>
        <div class="glow"></div>
        <div class="vignette"></div>
        <div class="grain-edge"></div>

        <div class="badge">100% FREE</div>

        <div class="stage">
          <div class="lockup">
            <div class="logo">🎙️</div>
            <div class="wordmark">Talkative</div>
          </div>
          <div class="tagline">HOLD.<br/>SPEAK.<br/><span class="accent">DONE.</span></div>
          <div class="sub">Free voice typing for Windows — no account, no subscription</div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["thumbnail"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
